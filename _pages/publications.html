layout: archive
title: "Publications"
permalink: /publications/
author_profile: true
---

{% include base_path %}

<style>
  .pub-category {
    margin-top: 2.2rem;
    margin-bottom: 1.2rem;
    font-size: 1.3rem;
    border-bottom: 2px solid #eaeaea;
    padding-bottom: 0.4rem;
    color: #222;
  }
  .pub-list {
    list-style: none;
    counter-reset: pub-counter;
    padding-left: 0;
    margin: 0;
  }
  .pub-item {
    counter-increment: pub-counter;
    margin-bottom: 1.2rem;
    line-height: 1.6;
    font-size: 0.95rem;
    position: relative;
    padding-left: 3rem;
    color: #333;
  }
  .pub-item::before {
    content: "[" counter(pub-counter) "]";
    position: absolute;
    left: 0;
    font-weight: bold;
    color: #222;
  }
</style>

<div id="loading" style="font-size: 0.95rem; color: #666; margin: 1.5rem 0;">Loading publications...</div>

<div id="journals-section" style="display:none;">
  <h2 class="pub-category">Journal Articles</h2>
  <ol class="pub-list" id="journal-list"></ol>
</div>

<div id="conferences-section" style="display:none;">
  <h2 class="pub-category">Conference Proceedings</h2>
  <ol class="pub-list" id="conference-list"></ol>
</div>

<div id="magazines-section" style="display:none;">
  <h2 class="pub-category">Magazine Articles</h2>
  <ol class="pub-list" id="magazine-list"></ol>
</div>

<script src="https://cdn.jsdelivr.net/npm/bibtex-parse-js@0.0.24/bibtex-js.min.js"></script>
<script>
  function formatIEEEAuthor(authorsStr) {
    if (!authorsStr) return '';
    const authors = authorsStr.split(' and ').map(a => a.trim());
    const formatted = authors.map(author => {
      if (author.includes(',')) {
        const parts = author.split(',');
        const last = parts[0].trim();
        const first = parts[1].trim();
        const initials = first.split(' ').map(n => n[0] ? n[0] + '.' : '').join(' ');
        return initials + ' ' + last;
      } else {
        const parts = author.split(' ');
        const last = parts.pop();
        const initials = parts.map(n => n[0] ? n[0] + '.' : '').join(' ');
        return (initials ? initials + ' ' : '') + last;
      }
    });
    if (formatted.length === 1) return formatted[0];
    if (formatted.length === 2) return formatted[0] + ' and ' + formatted[1];
    return formatted.slice(0, -1).join(', ') + ', and ' + formatted[formatted.length - 1];
  }

  fetch('/papers.bib')
    .then(response => {
      if (!response.ok) throw new Error('فایل papers.bib پیدا نشد');
      return response.text();
    })
    .then(bibData => {
      const loader = document.getElementById('loading');
      if (loader) loader.style.display = 'none';
      
      const parsed = BibtexParser(bibData);

      parsed.forEach(entry => {
        const tags = {};
        for (let key in entry.entryTags) {
          tags[key.toLowerCase()] = entry.entryTags[key].replace(/[{}]/g, '');
        }

        const author = formatIEEEAuthor(tags.author);
        const title = tags.title ? `“${tags.title.trim().replace(/[,.]$/, '')},” ` : '';
        const journal = tags.journal || tags.booktitle || '';
        const volume = tags.volume ? `vol. ${tags.volume}, ` : '';
        const number = tags.number ? `no. ${tags.number}, ` : '';
        const pages = tags.pages ? `pp. ${tags.pages.replace('--', '–')}, ` : '';
        const year = tags.year ? tags.year + '.' : '';

        const li = document.createElement('li');
        li.className = 'pub-item';
        li.innerHTML = `${author}, ${title}<em>${journal}</em>, ${volume}${number}${pages}${year}`;

        const type = entry.entryType.toLowerCase();
        const journalLower = (tags.journal || '').toLowerCase();

        if (type === 'article') {
          if (journalLower.includes('magazine')) {
            document.getElementById('magazines-section').style.display = 'block';
            document.getElementById('magazine-list').appendChild(li);
          } else {
            document.getElementById('journals-section').style.display = 'block';
            document.getElementById('journal-list').appendChild(li);
          }
        } else if (type === 'inproceedings' || type === 'conference') {
          document.getElementById('conferences-section').style.display = 'block';
          document.getElementById('conference-list').appendChild(li);
        }
      });
    })
    .catch(err => {
      const loader = document.getElementById('loading');
      if (loader) loader.innerText = 'خطا در بارگذاری مقالات: ' + err.message;
    });
</script>
