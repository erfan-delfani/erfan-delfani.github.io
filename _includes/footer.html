{% include base_path %}

<footer class="page__footer" style="background: transparent !important; border-top: 1px solid #eaeaea; margin-top: 2em; padding: 12px 0 !important; min-height: auto !important;">
  <div class="page__footer-copyright" style="text-align: center; margin: 0 !important; font-size: 0.75rem; color: #888;">
    &copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }} &middot; Powered by Jekyll
  </div>
</footer>
